<g id="o1:2" transform="translate(144, 96)"><rect x="0" y="0" width="512" height="80" fill="#ffffff" stroke="#4f5d75" stroke-width="1.6" rx="20" ry="20"/></g>
<g id="a1:2" transform="translate(289, 107.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="111"><tspan x="111" y="18.824"><tspan x="20.77" text-anchor="start">进入当前 token 前的状态</tspan></tspan></text></g>
<g id="a1:3" transform="translate(374.5, 133.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="25.5"><tspan x="25.5" y="18.824"><tspan x="-0.355" text-anchor="start">S_prev</tspan></tspan></text></g>
<g id="o1:3" transform="translate(144, 208)"><rect x="0" y="0" width="512" height="80" fill="#ffffff" stroke="#4f5d75" stroke-width="1.6" rx="6" ry="6"/></g>
<g id="a1:4" transform="translate(349, 219.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="51"><tspan x="51" y="18.824"><tspan x="11" text-anchor="start">衰减旧状态</tspan></tspan></text></g>
<g id="a1:5" transform="translate(320, 245.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="80"><tspan x="80" y="18.824"><tspan x="2.505" text-anchor="start">S_decay = α * S_prev</tspan></tspan></text></g>
<g id="o1:4" transform="translate(144, 320)"><rect x="0" y="0" width="512" height="80" fill="#ffffff" stroke="#4f5d75" stroke-width="1.6" rx="6" ry="6"/></g>
<g id="a1:6" transform="translate(290.5, 331.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="109.5"><tspan x="109.5" y="18.824"><tspan x="21.5" text-anchor="start">读取旧预测，计算纠正量</tspan></tspan></text></g>
<g id="a1:7" transform="translate(316.5, 357.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="83.5"><tspan x="83.5" y="18.824"><tspan x="4.91" text-anchor="start">δ = β * (v - S_decay k)</tspan></tspan></text></g>
<g id="o1:5" transform="translate(144, 432)"><rect x="0" y="0" width="512" height="88" fill="#f8e7e0" stroke="#bf4520" stroke-width="1.6" rx="6" ry="6"/></g>
<g id="a1:8" transform="translate(298, 443.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#bf4520" text-anchor="middle" dominant-baseline="alphabetic" x="102"><tspan x="102" y="18.824"><tspan x="20.56" text-anchor="start">沿当前 key 写回纠正量</tspan></tspan></text></g>
<g id="a1:9" transform="translate(303.5, 469.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="96.5"><tspan x="96.5" y="18.824"><tspan x="3.69" text-anchor="start">S_next = S_decay + δ k^T</tspan></tspan></text></g>
<g id="o1:6" transform="translate(144, 552)"><rect x="0" y="0" width="512" height="80" fill="#ffffff" stroke="#4f5d75" stroke-width="1.6" rx="20" ry="20"/></g>
<g id="a1:10" transform="translate(298.5, 563.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="101.5"><tspan x="101.5" y="18.824"><tspan x="18.78" text-anchor="start">用 query 读出当前结果</tspan></tspan></text></g>
<g id="a1:11" transform="translate(353, 589.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#4f5d75" text-anchor="middle" dominant-baseline="alphabetic" x="47"><tspan x="47" y="18.824"><tspan x="2.105" text-anchor="start">o = S_next q</tspan></tspan></text></g>
<g id="c1:5" transform="translate(760, 232)"><path fill="none" stroke="#4f5d75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 88"/></g>
<g id="a1:12" transform="translate(788, 237.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">α 控制整体保留比例</tspan></tspan></text></g>
<g id="a1:13" transform="translate(788, 265.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">预测使用衰减后的 S_decay。</tspan></tspan></text></g>
<g id="a1:14" transform="translate(788, 293.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">β=0 时，衰减仍然发生。</tspan></tspan></text></g>
<g id="c1:6" transform="translate(760, 432)"><path fill="none" stroke="#bf4520" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 0 116"/></g>
<g id="a1:15" transform="translate(788, 437.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="bold" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">β 控制当前 key 的纠正强度</tspan></tspan></text></g>
<g id="a1:16" transform="translate(788, 465.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">当 ||k||_2=1 且 β=1，</tspan></tspan></text></g>
<g id="a1:17" transform="translate(788, 493.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">更新后有 S_next k = v。</tspan></tspan></text></g>
<g id="a1:18" transform="translate(788, 521.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">其他非正交 key 仍可能受影响。</tspan></tspan></text></g>
<g id="c1:7" transform="translate(64, 664)"><path fill="none" stroke="#bfc0c0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" d="M 0 0 L 1152 0"/></g>
<g id="a1:19" transform="translate(64, 677.176)"><text font-size="16" font-family="Noto Sans SC" font-weight="normal" fill="#4f5d75" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="18.824"><tspan x="0" text-anchor="start">单 head：S 为 d_v × d_k。图中省略投影、短卷积、归一化和输出门。</tspan></tspan></text></g>
</svg>