<g id="a1:14" transform="translate(64, 189.882)"><text font-size="12" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">本节点请求数 + 所有子节点的子树权重</tspan></tspan></text></g>
<g id="a1:15" transform="translate(832, 159.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="bold" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">A 的权重为 1 + 2 + 1 = 4</tspan></tspan></text></g>
<g id="a1:16" transform="translate(832, 189.882)"><text font-size="12" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">先遍历 A，再遍历 B。</tspan></tspan></text></g>
<g id="a1:17" transform="translate(832, 479.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="bold" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">在 A 子树内</tspan></tspan></text></g>
<g id="a1:18" transform="translate(832, 509.882)"><text font-size="12" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">A1 → A2 → A 自身</tspan></tspan></text></g>
<g id="a1:19" transform="translate(832, 537.882)"><text font-size="12" font-family="Noto Sans SC" font-weight="normal" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">因此 a4 排在 a1、a2、a3 之后。</tspan></tspan></text></g>
