<g id="a1:20" transform="translate(64, 627.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="bold" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">最终请求顺序</tspan></tspan></text></g>
<g id="a1:21" transform="translate(288, 627.529)"><text font-size="14" font-family="Noto Sans SC" font-weight="bold" fill="#2d3142" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="16.471"><tspan x="0" text-anchor="start">a1 → a2 → a3 → a4 → b1</tspan></tspan></text></g>
<g id="a1:22" transform="translate(64, 673.882)"><text font-size="12" font-family="Noto Sans SC" font-weight="normal" fill="#4f5d75" text-anchor="start" dominant-baseline="alphabetic" x="0"><tspan x="0" y="14.118"><tspan x="0" text-anchor="start">连线：缓存树父子关系　橙色：优先遍历的子树　同一节点内保留请求原顺序</tspan></tspan></text></g>
